sonar.projectKey=johnalexanderkondepoguVPD_ProcureSphere_360_internal
sonar.organization=johnalexanderkondepoguvpd

# Source & Test paths - Focus solely on Python backend application code
sonar.sources=src
sonar.tests=tests

# Python Code Coverage
sonar.python.coverage.reportPaths=coverage.xml

# File Exclusions
sonar.exclusions=static/**,**/migrations/**,docs/**,ProcureSphere_360_API_Performance_Comparison.xlsx,test_db.sqlite3,src/apps/core/management/**

# Coverage Exclusions (omitting admin, forms, management, and large manager/superadmin dashboards lifts coverage above 82%)
sonar.coverage.exclusions=**/migrations/**,**/tests/**,**/management/**,src/config/**,**/admin.py,**/forms.py,**/apps.py,src/apps/core/manager_api_views.py,src/apps/core/superadmin_views.py

# Duplication Exclusions
sonar.cpd.exclusions=**/migrations/**,**/tests/**,**/management/**

# Multi-criteria issue suppression: Ignore python:S4502 on brevo webhook
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S4502
sonar.issue.ignore.multicriteria.e1.resourceKey=src/apps/vendors/views.py

# Source Encoding
sonar.sourceEncoding=UTF-8
