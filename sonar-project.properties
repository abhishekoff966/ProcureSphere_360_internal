sonar.projectKey=johnalexanderkondepoguVPD_ProcureSphere_360_internal
sonar.organization=johnalexanderkondepoguvpd

# Source & Test paths
sonar.sources=src,templates
sonar.tests=tests

# Python Code Coverage
sonar.python.coverage.reportPaths=coverage.xml

# File Exclusions
sonar.exclusions=static/**,**/migrations/**,docs/**,ProcureSphere_360_API_Performance_Comparison.xlsx,test_db.sqlite3

# Coverage Exclusions (omit migrations, tests, seed scripts, templates & config from coverage denominator)
sonar.coverage.exclusions=**/migrations/**,**/tests/**,**/management/**,src/config/**,templates/**

# Duplication Exclusions (omit migrations, tests, seed scripts & templates from duplication checks)
sonar.cpd.exclusions=**/migrations/**,**/tests/**,**/management/**,templates/**

# Source Encoding
sonar.sourceEncoding=UTF-8
