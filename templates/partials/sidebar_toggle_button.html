<!-- ProcureSphere 360 Enterprise Sidebar Toggle Button -->
<button class="btn sidebar-toggle-btn ms-2 ms-sm-3"
        type="button"
        id="sidebarToggleBtn"
        data-sidebar-target="{{ sidebar_id|default:'sidebar' }}"
        data-bs-toggle="tooltip"
        data-bs-placement="bottom"
        data-bs-trigger="hover"
        title="Collapse Sidebar"
        aria-label="Collapse Sidebar"
        aria-controls="{{ sidebar_id|default:'sidebar' }}"
        aria-expanded="true">
    <!-- PanelLeftClose icon (visible when sidebar is expanded) -->
    <svg class="sidebar-icon-collapse" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect width="18" height="18" x="3" y="3" rx="2"></rect>
        <path d="M9 3v18"></path>
        <path d="m16 15-3-3 3-3"></path>
    </svg>
    <!-- PanelLeftOpen icon (visible when sidebar is collapsed) -->
    <svg class="sidebar-icon-expand d-none" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect width="18" height="18" x="3" y="3" rx="2"></rect>
        <path d="M9 3v18"></path>
        <path d="m14 9 3 3-3 3"></path>
    </svg>
</button>
